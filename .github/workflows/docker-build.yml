name: CoMSES Docker CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: build containers
      run: ./build.sh
    - name: Run release verification
      run: |
        make build
        make check
        make migrations-check
        make test
        docker compose run --rm test uv build
    - name: Build documentation
      run: docker compose run --rm test bash -lc 'cd /code/docs && make clean html'
