[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citation"
version = "1.0.0"
description = "Citation management and deduplication for Django"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
authors = [
  { name = "CoMSES", email = "devs@comses.net" }
]
classifiers = [
  "Environment :: Web Environment",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Developers",
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "bibtexparser~=1.4.4",
  "bleach~=6.4.0",
  "Django~=5.2.17",
  "django-extensions~=4.1",
  "django-model-utils~=5.0.0",
  "djangorestframework~=3.18.0",
  "fuzzywuzzy~=0.18.0",
  "lxml~=6.1.2",
  "markdown~=3.10.3",
  "pandas~=3.0.5",
  "psycopg2-binary~=2.9.12",
  "pyparsing~=3.3.2",
  "python-Levenshtein~=0.27.4",
  "python-dateutil~=2.9.0.post0",
  "Pyzotero~=1.14.0",
  "requests~=2.34.2",
  "Unidecode~=1.4.0",
  "invoke~=3.0.3",
  "scipy~=1.18.1",
]

[project.urls]
Homepage = "https://github.com/comses/citation"
Documentation = "https://citation.readthedocs.io/en/latest/"

[dependency-groups]
dev = [
  "coveralls",
  "coverage",
  "ipython",
  "ruff",
  "sphinx",
  "myst-parser",
]

[tool.setuptools.packages.find]
include = ["citation*"]
